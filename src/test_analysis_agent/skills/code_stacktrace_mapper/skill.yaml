name: code.stacktrace_mapper
version: "1.0.0"
description: "将栈追踪帧映射到源代码文件路径和行号。"
author: "测试分析 Agent 团队"
tags:
  - 代码
  - 栈追踪
  - 行级定位

input_schema:
  type: object
  required:
    - stack_trace
  properties:
    stack_trace:
      type: string
      description: "原始栈追踪文本。"
    language_hint:
      type: string
      enum: [python, java, javascript, auto]
      default: auto
      description: "语言提示，指定使用哪种解析器。"

output_schema:
  type: object
  properties:
    frames:
      type: array
      items:
        type: object
        properties:
          file:
            type: string
          line:
            type: integer
          function:
            type: string
          code_snippet:
            type: string
          is_user_code:
            type: boolean
            description: "是否为用户代码（非标准库/第三方库）。"
    language:
      type: string
      description: "检测到的编程语言。"
    deepest_user_frame:
      type: object
      description: "最深层的用户代码帧（最接近错误的项目代码）。"
      properties:
        file:
          type: string
        line:
          type: integer
        function:
          type: string
