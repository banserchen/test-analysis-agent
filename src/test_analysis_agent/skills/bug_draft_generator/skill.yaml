name: bug.draft_generator
version: "1.0.0"
description: "根据分析结果自动生成缺陷单草稿。"
author: "测试分析 Agent 团队"
tags:
  - 缺陷
  - 草稿
  - 报告

input_schema:
  type: object
  required:
    - issues
  properties:
    issues:
      type: array
      description: "分析流水线输出的 AnalyzedIssue 对象列表。"
      items:
        type: object
        properties:
          title:
            type: string
          description:
            type: string
          category:
            type: string
          severity:
            type: string
          root_cause:
            type: string
          suggestion:
            type: string
          affected_tests:
            type: array
            items:
              type: string
          log_evidence:
            type: string
    job_name:
      type: string
      description: "Jenkins 任务名称。"
    build_number:
      type: integer
      description: "Jenkins 构建编号。"

output_schema:
  type: object
  properties:
    bug_drafts:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
          severity:
            type: string
            enum: [critical, high, medium, low]
          component:
            type: string
          description:
            type: string
            description: "Markdown 格式的完整缺陷描述。"
          steps_to_reproduce:
            type: string
          expected_behavior:
            type: string
          actual_behavior:
            type: string
          environment:
            type: string
          labels:
            type: array
            items:
              type: string
    count:
      type: integer
